<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小星星学习与错题乐园 - iPad专属版</title>
    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 引入 Lucide 图标 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=ZCOOL+KuaiLe&display=swap');
        
        body {
            font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0fdf4;
            color: #1f2937;
            touch-action: manipulation;
        }
        
        .font-fun {
            font-family: 'ZCOOL KuaiLe', cursive, sans-serif;
        }

        .btn-touch:active {
            transform: scale(0.95);
        }
        
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col select-none">

    <!-- 顶部导航栏 -->
    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-50 border-b border-emerald-100 px-4 py-3 flex items-center justify-between shadow-xs">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-emerald-500 rounded-2xl flex items-center justify-center text-white shadow-md shadow-emerald-200">
                <i data-lucide="star" class="w-6 h-6 fill-current"></i>
            </div>
            <div>
                <h1 class="font-fun text-xl text-emerald-800 tracking-wide">小星星学习与错题乐园 🌟</h1>
                <p class="text-xs text-gray-500">看课打卡 + 语数英错题本</p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <!-- 切换视图按钮 -->
            <div class="bg-emerald-50 p-1 rounded-2xl flex space-x-1 border border-emerald-200">
                <button onclick="switchTab('study')" id="tab-btn-study" class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all bg-emerald-500 text-white shadow-xs">📚 课程打卡</button>
                <button onclick="switchTab('wrong')" id="tab-btn-wrong" class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all text-emerald-700 hover:bg-emerald-100">📝 错题跟进</button>
            </div>

            <!-- 家长后台设置按钮 -->
            <button onclick="toggleSettings()" class="btn-touch w-10 h-10 bg-gray-100 hover:bg-gray-200 rounded-full flex items-center justify-center text-gray-600 transition-colors">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- 课程打卡视图 -->
    <main id="view-study" class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-12 gap-6">
        <div class="md:col-span-4 space-y-4">
            <div class="bg-white rounded-3xl p-5 shadow-sm border border-emerald-100">
                <h2 class="font-fun text-lg text-gray-700 mb-3 flex items-center">
                    <i data-lucide="book-open" class="w-5 h-5 mr-2 text-emerald-500"></i>
                    课程目录
                </h2>
                <div id="course-chapters-list" class="space-y-2"></div>
            </div>
        </div>
        <div class="md:col-span-8 flex flex-col space-y-4">
            <div class="bg-white rounded-3xl p-5 md:p-6 shadow-sm border border-emerald-100 flex-1 flex flex-col">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-4 border-b border-gray-100 mb-4 gap-2">
                    <div>
                        <span id="current-chapter-badge" class="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full">第 1 部分</span>
                        <h2 id="current-chapter-title" class="font-fun text-2xl text-gray-800 mt-1">课程标题</h2>
                    </div>
                    <div class="text-xs text-gray-400">点击星星打卡，全部学完有大奖杯哦！🏆</div>
                </div>
                <div id="video-list-container" class="space-y-3 flex-1 overflow-y-auto no-scrollbar"></div>
            </div>
        </div>
    </main>

    <!-- 错题跟进系统视图 -->
    <main id="view-wrong" class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 hidden flex flex-col space-y-6">
        <div class="flex flex-col sm:flex-row items-center justify-between bg-white p-4 rounded-3xl shadow-sm border border-emerald-100 gap-4">
            <div class="flex space-x-2 w-full sm:w-auto">
                <button onclick="filterSubject('all')" id="sub-all" class="flex-1 sm:flex-none px-4 py-2 rounded-2xl text-xs font-bold bg-emerald-500 text-white shadow-xs">全部科目</button>
                <button onclick="filterSubject('chinese')" id="sub-chinese" class="flex-1 sm:flex-none px-4 py-2 rounded-2xl text-xs font-bold bg-gray-100 text-gray-600 hover:bg-gray-200">📖 语文</button>
                <button onclick="filterSubject('math')" id="sub-math" class="flex-1 sm:flex-none px-4 py-2 rounded-2xl text-xs font-bold bg-gray-100 text-gray-600 hover:bg-gray-200">🔢 数学</button>
                <button onclick="filterSubject('english')" id="sub-english" class="flex-1 sm:flex-none px-4 py-2 rounded-2xl text-xs font-bold bg-gray-100 text-gray-600 hover:bg-gray-200">🔤 英语</button>
            </div>
            <button onclick="openAddWrongModal()" class="w-full sm:w-auto px-5 py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-fun text-sm rounded-2xl shadow-md shadow-amber-200 flex items-center justify-center space-x-2 btn-touch">
                <i data-lucide="plus-circle" class="w-4 h-4"></i>
                <span>+ 拍照/记录错题</span>
            </button>
        </div>

        <div id="wrong-questions-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-1"></div>
    </main>

    <!-- 新增错题弹窗（支持拍照/选相册） -->
    <div id="add-wrong-modal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full flex flex-col shadow-2xl overflow-hidden">
            <div class="p-5 border-b border-gray-100 flex items-center justify-between bg-amber-50">
                <h3 class="font-fun text-xl text-amber-900 flex items-center">
                    <i data-lucide="camera" class="w-5 h-5 mr-2 text-amber-600"></i>
                    添加新错题
                </h3>
                <button onclick="closeAddWrongModal()" class="w-8 h-8 rounded-full bg-white flex items-center justify-center text-gray-500 hover:bg-gray-100">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">选择科目</label>
                    <select id="wrong-subject-input" class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-2.5 text-sm text-gray-700 focus:outline-none focus:border-amber-500">
                        <option value="chinese">📖 语文</option>
                        <option value="math">🔢 数学</option>
                        <option value="english">🔤 英语</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">错题内容/知识点描述</label>
                    <textarea id="wrong-desc-input" rows="3" class="w-full bg-gray-50 border border-gray-200 rounded-2xl p-3 text-sm text-gray-700 focus:outline-none focus:border-amber-500" placeholder="例如：错别字订正、应用题计算错误等..."></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">拍照或从相册选择错题照片</label>
                    <input type="file" id="wrong-file-input" accept="image/*" class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-2 text-sm text-gray-700 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-100 file:text-amber-800 hover:file:bg-amber-200">
                </div>
            </div>
            <div class="p-4 border-t border-gray-100 bg-gray-50 flex justify-end space-x-3">
                <button onclick="closeAddWrongModal()" class="px-5 py-2.5 rounded-2xl text-sm font-bold text-gray-600 hover:bg-gray-200 transition-colors">取消</button>
                <button onclick="saveNewWrongQuestion()" class="px-6 py-2.5 rounded-2xl text-sm font-bold bg-amber-500 hover:bg-amber-600 text-white shadow-md shadow-amber-200 transition-colors">保存错题</button>
            </div>
        </div>
    </div>

    <!-- 家长后台设置弹窗 -->
    <div id="settings-modal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-5 border-b border-gray-100 flex items-center justify-between bg-emerald-50">
                <h3 class="font-fun text-xl text-emerald-900 flex items-center">
                    <i data-lucide="settings" class="w-5 h-5 mr-2 text-emerald-600"></i>
                    家长设置：网盘链接管理
                </h3>
                <button onclick="toggleSettings()" class="w-8 h-8 rounded-full bg-white flex items-center justify-center text-gray-500 hover:bg-gray-100">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4 flex-1" id="settings-links-container"></div>
            <div class="p-4 border-t border-gray-100 bg-gray-50 flex justify-end space-x-3">
                <button onclick="toggleSettings()" class="px-5 py-2.5 rounded-2xl text-sm font-bold text-gray-600 hover:bg-gray-200 transition-colors">取消</button>
                <button onclick="saveSettings()" class="px-6 py-2.5 rounded-2xl text-sm font-bold bg-emerald-500 hover:bg-emerald-600 text-white shadow-md shadow-emerald-200 transition-colors">保存修改</button>
            </div>
        </div>
    </div>

    <!-- JavaScript 逻辑 -->
    <script>
        const defaultChapters = [
            {
                id: 1,
                title: "第301讲·四则运算一",
                badge: "第 1 部分",
                videos: [
                    { id: "v1_1", name: "第301讲.四则运算一-[1.基础计算].mp4", size: "48.3M", url: "https://pan.quark.cn/" },
                    { id: "v1_2", name: "第301讲.四则运算一-[2.添去括号凑整].mp4", size: "61.7M", url: "https://pan.quark.cn/" }
                ]
            }
        ];

        let currentChapterId = 1;
        let chapters = JSON.parse(localStorage.getItem('kids_study_chapters')) || defaultChapters;
        let progress = JSON.parse(localStorage.getItem('kids_study_progress')) || {};
        
        let wrongQuestions = JSON.parse(localStorage.getItem('kids_wrong_questions')) || [
            { id: 'w1', subject: 'chinese', desc: '【错别字订正】把“辨别”的“辨”字误写成了“辩论”的“辩”。', img: '', fixed: false, date: '2026-03-30' },
            { id: 'w2', subject: 'math', desc: '【应用题】鸡兔同笼脚数差计算错误。', img: '', fixed: false, date: '2026-03-30' }
        ];
        let currentSubjectFilter = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            renderChaptersList();
            renderCurrentChapter();
            renderWrongQuestions();
            lucide.createIcons();
        });

        function switchTab(tab) {
            const studyView = document.getElementById('view-study');
            const wrongView = document.getElementById('view-wrong');
            const btnStudy = document.getElementById('tab-btn-study');
            const btnWrong = document.getElementById('tab-btn-wrong');

            if (tab === 'study') {
                studyView.classList.remove('hidden');
                wrongView.classList.add('hidden');
                btnStudy.className = "px-3 py-1.5 rounded-xl text-xs font-bold transition-all bg-emerald-500 text-white shadow-xs";
                btnWrong.className = "px-3 py-1.5 rounded-xl text-xs font-bold transition-all text-emerald-700 hover:bg-emerald-100";
            } else {
                studyView.classList.add('hidden');
                wrongView.classList.remove('hidden');
                btnWrong.className = "px-3 py-1.5 rounded-xl text-xs font-bold transition-all bg-amber-500 text-white shadow-xs";
                btnStudy.className = "px-3 py-1.5 rounded-xl text-xs font-bold transition-all text-emerald-700 hover:bg-emerald-100";
                renderWrongQuestions();
            }
        }

        function renderChaptersList() {
            const container = document.getElementById('course-chapters-list');
            container.innerHTML = '';
            chapters.forEach(chap => {
                let completedCount = chap.videos.filter(v => progress[v.id]).length;
                let isSelected = chap.id === currentChapterId;
                let div = document.createElement('div');
                div.className = `p-4 rounded-2xl cursor-pointer transition-all border ${isSelected ? 'bg-emerald-500 text-white border-emerald-500 shadow-md shadow-emerald-200' : 'bg-gray-50 hover:bg-emerald-50 border-gray-100 text-gray-700'}`;
                div.onclick = () => { currentChapterId = chap.id; renderChaptersList(); renderCurrentChapter(); };
                div.innerHTML = `<div class="flex items-center justify-between mb-1"><span class="text-xs font-bold px-2 py-0.5 rounded-md ${isSelected ? 'bg-emerald-600 text-emerald-100' : 'bg-gray-200 text-gray-600'}">${chap.badge}</span><span class="text-xs font-medium opacity-80">${completedCount}/${chap.videos.length} 已学</span></div><div class="font-fun text-base">${chap.title}</div>`;
                container.appendChild(div);
            });
        }

        function renderCurrentChapter() {
            const chap = chapters.find(c => c.id === currentChapterId);
            document.getElementById('current-chapter-badge').innerText = chap.badge;
            document.getElementById('current-chapter-title').innerText = chap.title;
            const container = document.getElementById('video-list-container');
            container.innerHTML = '';
            chap.videos.forEach((video, index) => {
                let isDone = !!progress[video.id];
                let card = document.createElement('div');
                card.className = `p-4 rounded-2xl border transition-all flex items-center justify-between ${isDone ? 'bg-emerald-50/60 border-emerald-200' : 'bg-white border-gray-100 hover:border-emerald-200 shadow-xs'}`;
                card.innerHTML = `
                    <div class="flex items-center space-x-3 flex-1 min-w-0 pr-4">
                        <button onclick="toggleVideoProgress('${video.id}')" class="btn-touch w-10 h-10 rounded-full flex items-center justify-center transition-colors ${isDone ? 'bg-amber-400 text-white shadow-sm shadow-amber-200' : 'bg-gray-100 text-gray-300 hover:bg-gray-200'}">
                            <i data-lucide="star" class="w-5 h-5 ${isDone ? 'fill-current' : ''}"></i>
                        </button>
                        <div class="min-w-0 flex-1">
                            <h4 class="text-sm font-bold text-gray-800 truncate ${isDone ? 'line-through text-gray-400' : ''}">${index + 1}. ${video.name}</h4>
                            <span class="text-xs text-gray-400">大小: ${video.size}</span>
                        </div>
                    </div>
                    <a href="${video.url}" target="_blank" class="btn-touch px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold rounded-xl shadow-sm shadow-emerald-200 flex items-center space-x-1 shrink-0">
                        <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>
                        <span>去观看</span>
                    </a>`;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        function toggleVideoProgress(videoId) {
            progress[videoId] = !progress[videoId];
            localStorage.setItem('kids_study_progress', JSON.stringify(progress));
            renderChaptersList();
            renderCurrentChapter();
        }

        function filterSubject(sub) {
            currentSubjectFilter = sub;
            ['all', 'chinese', 'math', 'english'].forEach(s => {
                let btn = document.getElementById(`sub-${s}`);
                if (s === sub) {
                    btn.className = "flex-1 sm:flex-none px-4 py-2 rounded-2xl text-xs font-bold bg-emerald-500 text-white shadow-xs";
                } else {
                    btn.className = "flex-1 sm:flex-none px-4 py-2 rounded-2xl text-xs font-bold bg-gray-100 text-gray-600 hover:bg-gray-200";
                }
            });
            renderWrongQuestions();
        }

        function renderWrongQuestions() {
            const container = document.getElementById('wrong-questions-container');
            container.innerHTML = '';
            
            let filtered = wrongQuestions.filter(q => currentSubjectFilter === 'all' || q.subject === currentSubjectFilter);

            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-2 text-center py-12 text-gray-400 text-sm">太棒啦！当前科目下没有未订正的错题！🎉</div>`;
                return;
            }

            filtered.forEach(q => {
                let subName = q.subject === 'math' ? '🔢 数学' : (q.subject === 'chinese' ? '📖 语文' : '🔤 英语');
                let card = document.createElement('div');
                card.className = `p-5 rounded-3xl border transition-all flex flex-col justify-between ${q.fixed ? 'bg-emerald-50/50 border-emerald-200' : 'bg-white border-amber-200 shadow-sm'}`;
                
                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-bold px-2.5 py-1 rounded-full ${q.subject === 'math' ? 'bg-blue-100 text-blue-700' : (q.subject === 'chinese' ? 'bg-rose-100 text-rose-700' : 'bg-purple-100 text-purple-700')}">${subName}</span>
                            <span class="text-xs text-gray-400">${q.date}</span>
                        </div>
                        <p class="text-sm font-medium text-gray-800 mb-3 ${q.fixed ? 'line-through text-gray-400' : ''}">${q.desc}</p>
                        ${q.img ? `<img src="${q.img}" class="w-full h-40 object-cover rounded-2xl mb-3 border border-gray-100">` : ''}
                    </div>
                    <div class="flex items-center justify-between pt-3 border-t border-gray-100 mt-2">
                        <button onclick="toggleWrongFixed('${q.id}')" class="btn-touch px-4 py-2 rounded-xl text-xs font-bold flex items-center space-x-1.5 transition-all ${q.fixed ? 'bg-emerald-500 text-white shadow-sm shadow-emerald-200' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}">
                            <i data-lucide="check-circle" class="w-4 h-4"></i>
                            <span>${q.fixed ? '已订正 (再次点击取消)' : '✅ 打勾确认订正'}</span>
                        </button>
                        <button onclick="deleteWrong('${q.id}')" class="text-gray-400 hover:text-red-500 text-xs px-2 py-1">删除</button>
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        function openAddWrongModal() {
            document.getElementById('wrong-desc-input').value = '';
            document.getElementById('wrong-file-input').value = '';
            document.getElementById('add-wrong-modal').classList.remove('hidden');
        }

        function closeAddWrongModal() {
            document.getElementById('add-wrong-modal').classList.add('hidden');
        }

        function saveNewWrongQuestion() {
            let subject = document.getElementById('wrong-subject-input').value;
            let desc = document.getElementById('wrong-desc-input').value.trim();
            let fileInput = document.getElementById('wrong-file-input');

            if (!desc && fileInput.files.length === 0) {
                alert('请填写错题描述，或者拍照/选择一张错题照片！');
                return;
            }

            if (fileInput.files.length > 0) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    finishSaveWrong(subject, desc, e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                finishSaveWrong(subject, desc, '');
            }
        }

        function finishSaveWrong(subject, desc, imgBase64) {
            let newQ = {
                id: 'w_' + Date.now(),
                subject: subject,
                desc: desc || '拍照错题',
                img: imgBase64,
                fixed: false,
                date: new Date().toISOString().slice(0, 10)
            };

            wrongQuestions.unshift(newQ);
            localStorage.setItem('kids_wrong_questions', JSON.stringify(wrongQuestions));
            closeAddWrongModal();
            renderWrongQuestions();
        }

        function toggleWrongFixed(id) {
            let q = wrongQuestions.find(item => item.id === id);
            if (q) {
                q.fixed = !q.fixed;
                localStorage.setItem('kids_wrong_questions', JSON.stringify(wrongQuestions));
                renderWrongQuestions();
            }
        }

        function deleteWrong(id) {
            if (confirm('确定要删除这条错题记录吗？')) {
                wrongQuestions = wrongQuestions.filter(item => item.id !== id);
                localStorage.setItem('kids_wrong_questions', JSON.stringify(wrongQuestions));
                renderWrongQuestions();
            }
        }

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                const container = document.getElementById('settings-links-container');
                container.innerHTML = '<div class="text-xs text-blue-600 mb-2">配置课程网盘链接：</div>';
                chapters.forEach(chap => {
                    chap.videos.forEach(video => {
                        let row = document.createElement('div');
                        row.className = 'flex items-center space-x-2 mb-2';
                        row.innerHTML = `<span class="text-xs text-gray-500 w-1/3 truncate">${video.name}</span><input type="text" id="input_${video.id}" value="${video.url}" class="flex-1 bg-gray-50 border border-gray-200 rounded-2xl px-3 py-1.5 text-xs text-gray-700">`;
                        container.appendChild(row);
                    });
                });
            }
        }

        function saveSettings() {
            chapters.forEach(chap => {
                chap.videos.forEach(video => {
                    let input = document.getElementById(`input_${video.id}`);
                    if (input) video.url = input.value.trim() || "https://pan.quark.cn/";
                });
            });
            localStorage.setItem('kids_study_chapters', JSON.stringify(chapters));
            toggleSettings();
            alert("网盘链接保存成功！");
        }
    </script>
</body>
</html>
